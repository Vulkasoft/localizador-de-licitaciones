# Sitio nginx para el Localizador de Licitaciones en un servidor que ya tiene otras webs.
# 1. Cambia "licitaciones.tudominio.com" por tu dominio (y 3000 si usaste otro APP_PORT).
# 2. Copia este archivo a /etc/nginx/sites-available/licitaciones y actívalo:
#      ln -s /etc/nginx/sites-available/licitaciones /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
# 3. Certificado HTTPS gratuito:
#      apt-get install -y certbot python3-certbot-nginx
#      certbot --nginx -d licitaciones.tudominio.com
server {
    listen 80;
    server_name licitaciones.tudominio.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La actualización de licitaciones envía progreso en streaming y puede tardar
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }
}
