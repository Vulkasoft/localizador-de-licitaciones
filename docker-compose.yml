services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-licitaciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-licitaciones}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: localizador-licitaciones:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-licitaciones}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-licitaciones}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Solo accesible desde el propio servidor; publícalo con Caddy (abajo) o con tu nginx.
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  # Sustituye a las tareas programadas de Abacus (ver scripts/cron/crontab).
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      APP_INTERNAL_URL: http://app:3000
      ALARM_CRON_SECRET: ${ALARM_CRON_SECRET:?Define ALARM_CRON_SECRET en .env}
    volumes:
      - ./scripts/cron:/cron:ro
    entrypoint: ["/bin/sh", "/cron/entrypoint.sh"]
    depends_on:
      - app

  # HTTPS automático con Let's Encrypt. Actívalo con:
  #   docker compose --profile https up -d
  # Si ya tienes nginx/Apache en el servidor, no lo uses y apunta tu proxy a 127.0.0.1:3000.
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
